<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<p class="swapButton" data-target="clockContainer">Clock</p>
		<p class="swapButton" data-target="stopwatchContainer">Stopwatch</p>
	</header>
	<main>
		<!-- Clock container -->
		<div id="clockContainer" class="clockContainer" data-vis="clockContainer">
			<div class="time">
				<h1 id="hours">0</h1>
				<h1>:</h1>
				<h1 id="minutes">0</h1>
				<h1>:</h1>
				<h1 id="seconds">0</h1>
			</div>
		</div>
		<!-- Stopwatch container -->
		<div id="stopwatchContainer" class="clockContainer notVisible" data-vis="stopwatchContainer">
			<div>
				<div class="time">
					<h1 id="stopwatchM">00</h1>
					<h1>:</h1>
					<h1 id="stopwatchS">00</h1>
					<h1>:</h1>
					<h1 id="stopwatchMS">000</h1>
				</div>
				<div class="buttonContainer">
					<button id="start">Start</button>
					<button id="lap">Lap</button>
					<button id="reset">Reset</button>
				</div>
			</div>
			<div id="lapContainer" class="time clock">	
			</div>
		</div>
	</main>
<script src="scripts/watch.js"></script>
<script src="scripts/stopwatch.js"></script>
<script src="scripts/visibilityHandler.js"></script>
</body>
</html>
