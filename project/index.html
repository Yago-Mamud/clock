<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="stylesheet" href="style.css">
	<link rel="icon" href="assets\images\favicon.png" sizes="any">
</head>
<body>
	<header>
		<h1 class="changeTab active" data-target="clockTab">Clock</h1>
		<h1 class="changeTab" data-target="timerTab">Timer</h1>
		<h1 class="changeTab" data-target="stopwatchTab">Stopwatch</h1>
	</header>
	<!-- CLOCK CONTAINER -->
	<main> 
		<div id="clockTab" class="container clock visible">
			<h1 id="hour"></h1>
			<h1 id="minute"></h1>
			<h1 id="second"></h1>
		</div>
		<div id="timerTab" class="container">
			<h1>timer</h1>
		</div>
		<div id="stopwatchTab" class="container">
			<h1>stopwatch</h1>
		</div>
	</main>
<script src="scripts.js">
</script>
</body>
</html>
