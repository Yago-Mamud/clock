<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<main>
		<section>
			<h1>Hello, world!</h1>
			<div class="time">
				<h1 id="hours">0</h1>
				<h1 id="minutes">0</h1>
				<h1 id="seconds">0</h1>
			</div>
			<div class="time chrono">
				<button id="start">Start</button>
				<h1 id="stopwatch">0</h1>
			</div>
		</section>
	</main>
<script src="scripts.js">
</script>
</body>
</html>
