<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="stylesheet" href="style.css">
	<link rel="icon" href="assets\images\favicon.png" sizes="any">
</head>
<body>
	<header>
		<h1 class="changeTab" data-target="clockTab">Clock</h1>
		<h1 class="changeTab active" data-target="timerTab">Timer</h1>
		<h1 class="changeTab" data-target="stopwatchTab">Stopwatch</h1>
	</header>
	<main> 
		<!-- CLOCK -->
		<div id="clockTab" class="container clock">
			<h1 id="hour"></h1>
			<h1 id="minute"></h1>
			<h1 id="second"></h1>
		</div>
		<!-- TIMER -->
		<div id="timerTab" class="container visible">
			<div class="timer">
				<input id="timerH" class="timerInput" type="text" maxlength="2" placeholder="00" value="00"></input>
				<input id="timerM" class="timerInput" type="text" maxlength="2" placeholder="00" value="00"></input>
				<input id="timerS" class="timerInput" type="text" maxlength="2" placeholder="00" value="00"></input>
			</div>
			<button id="timerStartButton">START</button>
		</div>
		<!-- STOPWATCH -->
		<div id="stopwatchTab" class="container">
			<h1>stopwatch</h1>
		</div>
	</main>
<script src="scripts.js">
</script>
</body>
</html>
